<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Лизинг Компас — демонстрация платформы</title><style>
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#f4f7fa;color:#0f2342}main,header{max-width:1100px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}a{color:#087f5b}h1{font-size:clamp(25px,5vw,36px);line-height:1.2}p{color:#526276}button,select{font:inherit;padding:10px;border-radius:10px;border:1px solid #c8d5e2;background:white;color:#0f2342}button[aria-pressed=true]{background:#0f2342;color:white}.tabs,.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.card{background:white;border:1px solid #dfe6ed;border-radius:16px;padding:18px;margin:10px 0}.stat{flex:1;min-width:130px;background:#0f2342;color:#fff;border-radius:14px;padding:14px}.stat strong{font-size:26px;display:block;color:#5ce3b0}.note{font-size:14px;padding:12px;border-left:3px solid #087f5b;background:#e5f4ee}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.stage{display:inline-block;padding:4px 9px;border-radius:8px;background:#e5f4ee;color:#076647;font-size:13px}.link{display:inline-block;padding:10px 14px;background:#087f5b;color:white;border-radius:10px;text-decoration:none}small{color:#526276}ul{padding-left:20px}h3{margin:0 0 6px}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #b6751c;outline-offset:2px}
</style></head><body><header><strong>ЛИЗИНГ КОМПАС</strong><a href="./">← На сайт</a></header><main><h1>Цифровая платформа лизинга</h1><p>Обзор рабочих кабинетов клиента, партнёра и брокера.</p><div class="note">Интерактивный макет на вымышленных данных. Это не авторизация и не доступ к реальным заявкам. Данные не отправляются и не сохраняются на сервере.</div><div class="tabs" aria-label="Демонстрационные роли"><button type="button" data-role="client" aria-pressed="false">Клиент</button><button type="button" data-role="partner" aria-pressed="false">Партнёр</button><button type="button" data-role="broker" aria-pressed="true">Брокер · CRM</button></div><div id="view" aria-live="polite"></div></main><script>
const stages=['Заявка','Документы','Предложение','Договор','Сделка'];
const sample=[{id:'D-101',title:'Парк легковых автомобилей',cost:12000000,stage:2,partner:'P1'},{id:'D-102',title:'Станок ЧПУ',cost:6000000,stage:1,partner:'P1'},{id:'D-103',title:'Коммерческий склад',cost:45000000,stage:3,partner:'P2'}];
let role='broker',filter='all';const fmt=n=>n.toLocaleString('ru-RU')+' ₽';const view=document.getElementById('view');function render(){document.querySelectorAll('[data-role]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.role===role)));if(role==='client'){view.innerHTML='<div class="card"><h3>Личный кабинет клиента</h3><p>Подготовка заявки, сравнение предложений, этапы сделки и документы.</p><a class="link" href="./cabinet.html">Открыть тестовый кабинет →</a></div><div class="card"><h3>Финансовые инструменты</h3><a href="./#calc-section">Калькулятор</a> · <a href="./#offer-compare">Сравнение КП</a></div>';return;}const records=role==='partner'?sample.filter(x=>x.partner==='P1'):sample;const rows=records.filter(x=>filter==='all'||String(x.stage)===filter);view.innerHTML='<h2>'+(role==='partner'?'Заявки партнёра P1':'Управление сделками')+'</h2><div class="stats"><div class="stat"><small style="color:#cbd9eb">Всего заявок</small><strong>'+records.length+'</strong></div><div class="stat"><small style="color:#cbd9eb">Объём имущества</small><strong>'+fmt(records.reduce((a,b)=>a+b.cost,0))+'</strong></div></div><label for="filter">Этап сделки </label><select id="filter"><option value="all">Все этапы</option>'+stages.map((x,i)=>'<option value="'+i+'">'+x+'</option>').join('')+'</select>'+rows.map(x=>'<article class="card"><div class="row"><div><small>'+x.id+'</small><h3>'+x.title+'</h3><p>'+fmt(x.cost)+'</p></div><span class="stage">'+stages[x.stage]+'</span></div><small>Тестовый сценарий. Документы и персональные данные отсутствуют.</small></article>').join('')+(rows.length?'':'<p>Нет заявок на выбранном этапе.</p>')+'<div class="card"><h3>Следующий этап развития</h3><p>'+(role==='partner'?'Защищённый обмен заявками и проверка партнёрских вознаграждений.':'Подключение защищённого API, журнала операций, доступа по ролям и реальных предложений компаний.')+'</p></div>';const select=document.getElementById('filter');select.value=filter;select.onchange=()=>{filter=select.value;render()};}document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;filter='all';render()});render();
</script></body></html>
