name: Secure intake checks
on:
  push:
    branches: ['feature/secure-intake-v1']
    paths: ['intake/**','.github/workflows/intake-check.yml']
  pull_request:
    paths: ['intake/**','.github/workflows/intake-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s intake -p 'test_*.py' -v
