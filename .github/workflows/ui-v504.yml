name: V5.05 interface regression
on:
  push:
    paths: ['variant-5.html','lk-ui-v504.js','lk-ui-v505.js','tests/ui-v505.test.cjs','tests/desktop-layout.test.cjs','tests/release-safety.test.cjs','tests/v5-navigation.test.cjs','lk-share-v3.js','lk-growth-v2.js','lk-app.webmanifest','tests/ui-v504.test.cjs','.github/workflows/ui-v504.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check lk-ui-v505.js && node --check lk-ui-v504.js && node --check lk-share-v3.js && node --check lk-growth-v2.js
      - run: node --test tests/v5-navigation.test.cjs tests/release-safety.test.cjs tests/desktop-layout.test.cjs tests/ui-v505.test.cjs tests/ui-v504.test.cjs tests/growth.test.cjs tests/share.test.cjs
