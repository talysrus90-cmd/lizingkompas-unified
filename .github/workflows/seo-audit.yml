name: SEO regression check
on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s seo -p test_engine.py -v
      - run: python seo/engine.py --review /tmp/lk-seo-review
      - run: python seo/audit.py
      - run: python seo/prepare_release.py --output /tmp/lk-seo-release --confirm-ready
      - run: python seo/engine.py --extend-release /tmp/lk-seo-release
      - run: python seo/audit.py --root /tmp/lk-seo-release --production
      - run: python -m py_compile seo/live_check.py seo/indexnow.py
      - run: python seo/indexnow.py --root /tmp/lk-seo-release --key $(basename $(find /tmp/lk-seo-release -maxdepth 1 -name '*.txt' ! -name robots.txt | head -1) .txt)
