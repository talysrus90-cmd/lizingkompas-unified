name: Production CRM and secure intake (isolated)
on:
  push:
    paths:
      - "production/**"
      - "seo/prepare_release.py"
      - "seo/test_prepare_release_v5.py"
      - ".github/workflows/production-backend.yml"
  pull_request:
    paths:
      - "production/**"
      - ".github/workflows/production-backend.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: compass_test
          POSTGRES_USER: compass_test
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compass_test -d compass_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://compass_test:local-ci-only@127.0.0.1:5432/compass_test"
      COMPASS_TEST_MODE: "1"
      DJANGO_ALLOWED_HOSTS: "testserver,127.0.0.1,localhost"
      PYTHONUTF8: "1"
      PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/production/backend"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: production/requirements.txt
      - name: Install pinned LTS-compatible production dependencies
        run: python -m pip install -r production/requirements.txt
      - name: Generate temporary encryption secret for TEST database only
        run: |
          python - <<'PY'
          import os
          from cryptography.fernet import Fernet
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
              f.write("COMPASS_FERNET_KEYS="+Fernet.generate_key().decode("ascii")+"\n")
              f.write("DJANGO_SECRET_KEY="+"test-only-"+os.urandom(48).hex()+"\n")
          PY
      - name: Check project and migration stability
        working-directory: production/backend
        run: |
          python manage.py check
          python manage.py makemigrations --dry-run --verbosity 3
          python manage.py makemigrations --check --dry-run
      - name: Validate encrypted lead intake and staff CRM on REAL PostgreSQL
        working-directory: production/backend
        run: python manage.py test intake --verbosity 2
      - name: Check SQLite test-only compatibility
        working-directory: production/backend
        run: env -u DATABASE_URL python manage.py test intake --verbosity 1
      - name: Verify production V5 release is built from current UI, excluding demos
        run: python -m unittest discover -s seo -p "test_prepare_release_v5.py" -v
      - name: Verify legal, backups and RKN fail-closed launch gates
        run: python -m unittest discover -s production/ops -p "test_preflight.py" -v

      - name: "Fail closed when live-intake launch prerequisites are missing"
        working-directory: production/backend
        run: |
          if COMPASS_TEST_MODE=0 COMPASS_PRODUCTION=1 COMPASS_LIVE_INTAKE=yes python manage.py check; then
            echo "ERROR: production started with missing secrets and launch gates"
            exit 1
          fi

      - name: Build final non-root application Docker image
        run: |
          docker build -f production/Dockerfile -t leasing-compass-app:ci .
      - name: Smoke-test actual production Gunicorn image with read-only filesystem
        run: |
          docker run -d --name compass-ci-smoke --network host \
            --read-only \
            --tmpfs /tmp:rw,nosuid,size=64m \
            --tmpfs /srv/compass/backend/collected_static:rw,nosuid,size=64m,uid=10001,gid=10001 \
            -e COMPASS_PRODUCTION=1 \
            -e DJANGO_ALLOWED_HOSTS=127.0.0.1,localhost,leasingcompass.ru \
            -e DATABASE_URL="$DATABASE_URL" \
            -e DJANGO_SECRET_KEY="$DJANGO_SECRET_KEY" \
            -e COMPASS_LIVE_INTAKE=no \
            --entrypoint sh leasing-compass-app:ci -c \
            'python manage.py collectstatic --noinput >/dev/null && exec gunicorn compassapp.wsgi:application --bind 127.0.0.1:18765 --workers 1 --access-logfile -'
          for n in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:18765/healthz >/dev/null; then break; fi
            sleep .3
          done
          curl --fail-with-body -sS http://127.0.0.1:18765/healthz | grep -F '"ok": true'
          code=$(curl -sS -o /tmp/intake-disabled.txt -w '%{http_code}' -H 'X-Forwarded-Proto: https' http://127.0.0.1:18765/apply/)
          test "$code" = "503"
      - name: Stop QA application container
        if: always()
        run: docker rm -f compass-ci-smoke || true
      - name: Validate Caddy syntax and public/private routing config
        run: |
          docker run --rm -v "$PWD/production/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e PRIMARY_DOMAIN=leasingcompass.ru caddy:2 caddy validate --config /etc/caddy/Caddyfile
      - name: Validate Docker Compose parser without deploying
        run: |
          cp production/.env.production.example production/.env.production
          docker compose --env-file production/.env.production -f production/docker-compose.prod.yml config -q
          rm -f production/.env.production
