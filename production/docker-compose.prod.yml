name: leasing-compass
services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks: [private]
    security_opt: [no-new-privileges:true]

  app:
    build:
      context: ..
      dockerfile: production/Dockerfile
    image: leasing-compass-app:local
    restart: unless-stopped
    env_file: .env.production
    environment:
      COMPASS_SSH_OPERATOR: "0"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=4)"]
      interval: 15s
      timeout: 6s
      retries: 6
      start_period: 25s
    networks: [private]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
      - /srv/compass/backend/collected_static:rw,nosuid,size=64m,uid=10001,gid=10001
    security_opt: [no-new-privileges:true]


  operator:
    # Separate private process. Never route /admin through public Caddy.
    image: leasing-compass-app:local
    restart: unless-stopped
    env_file: .env.production
    environment:
      COMPASS_SSH_OPERATOR: "1"
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8002:8000"
    networks: [private]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
      - /srv/compass/backend/collected_static:rw,nosuid,size=64m,uid=10001,gid=10001
    security_opt: [no-new-privileges:true]

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env.production
    ports: ["80:80","443:443","443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Publication requires a separate explicitly approved production build.
      - ${COMPASS_SITE_DIR:?Set an approved public site directory outside Git}:/srv/site:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [private,public]
    security_opt: [no-new-privileges:true]

volumes:
  pgdata:
  caddydata:
  caddyconfig:
networks:
  private:
    internal: true
  public:
